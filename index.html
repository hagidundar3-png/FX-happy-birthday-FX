<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F - Doğum Günü Özel</title>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .badge {
      background: #e11d48;
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 4px;
    }

    .sub-title {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .countdown {
      display: flex;
      justify-content: space-around;
      margin-top: 10px;
    }

    .time-box {
      background: #0f172a;
      padding: 10px;
      border-radius: 10px;
      width: 22%;
      border: 1px solid #334155;
    }

    .time-box span {
      display: block;
      font-size: 20px;
      font-weight: bold;
      color: #38bdf8;
    }

    .time-box label {
      font-size: 11px;
      color: #a1a1aa;
    }

    .character-container {
      width: 180px;
      height: 180px;
      margin: 15px auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lily-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 0.3s ease;
    }

    .dancing {
      animation: dance 0.6s infinite alternate ease-in-out;
    }

    @keyframes dance {
      0% { transform: translateY(0) rotate(-8deg) scale(1.05); }
      100% { transform: translateY(-12px) rotate(8deg) scale(1.05); }
    }

    .slider {
      width: 100%;
      margin: 15px 0;
      accent-color: #e11d48;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      position: relative;
      min-height: 50px;
      margin-top: 15px;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s ease;
    }

    .btn-yes {
      background: #22c55e;
      color: #fff;
      flex: 1;
    }

    .btn-no {
      background: #ef4444;
      color: #fff;
      position: absolute;
      right: 10px;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      margin-bottom: 12px;
      font-size: 14px;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #38bdf8;
    }

    .btn-send {
      background: #3b82f6;
      color: #fff;
      width: 100%;
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: #64748b;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<audio id="bgMusic" loop preload="auto">
  <source src="./9942.mp4" type="audio/mp4">
</audio>

<div class="container">
  
  <div class="card">
    <div class="badge">🎉 DOĞUM GÜNÜ ÖZEL</div>
    <h1>F</h1>
    <div class="sub-title">9 Eylül Doğum Günü Sayacı & Özel Sitem!</div>
    
    <div class="countdown">
      <div class="time-box"><span id="days">00</span><label>GÜN</label></div>
      <div class="time-box"><span id="hours">00</span><label>SAAT</label></div>
      <div class="time-box"><span id="minutes">00</span><label>DAK</label></div>
      <div class="time-box"><span id="seconds">00</span><label>SN</label></div>
    </div>
  </div>

  <div class="card">
    <h3>Beni Ne Kadar Seviyorsun?</h3>
    
    <div class="character-container">
      <img id="lily" class="lily-img" src="./8431.png" alt="Lily">
    </div>

    <input type="range" id="loveSlider" class="slider" min="0" max="100" value="50">
    <h2 id="lovePercent">%50</h2>
    <p id="loveText" style="color: #38bdf8; font-weight: bold; margin-top: 5px;">Açık Kollarla Sevgi! 🤗</p>
  </div>

  <div class="card" style="position: relative; overflow: hidden;">
    <h3>Bana Doğum Günü Hediyesi Alacak Mısın? 🎁</h3>
    <div class="buttons">
      <button class="btn btn-yes" type="button" onclick="handleGiftChoice('EVET! ALACAK')">EVET!</button>
      <button class="btn btn-no" type="button" id="noBtn" onclick="handleGiftChoice('HAYIR (Yakalayabildi!)')">HAYIR</button>
    </div>
  </div>

  <div class="card">
    <h3>Bana Bir Not / Dilek Bırak 📝</h3>
    <form id="contact-form">
      <input type="text" id="user_name" name="user_name" placeholder="Adın / Takma Adın" required>
      <textarea id="message" name="message" rows="3" placeholder="Doğum günü mesajını yazabilirsin..." required></textarea>
      
      <input type="hidden" id="love_score" name="love_score" value="%50">
      <input type="hidden" id="gift_status" name="gift_status" value="Henüz Seçilmedi">

      <button type="submit" class="btn btn-send">Notu Gönder 🚀</button>
    </form>
  </div>

  <footer>Made with ❤️ for F</footer>

</div>

<script>
  (function() {
    emailjs.init("R6xeaKVwmNn-JJY1Q");
  })();

  let giftChoice = "Henüz Basılmadı";

  function handleGiftChoice(choice) {
    giftChoice = choice;
    document.getElementById('gift_status').value = choice;
    if(choice.includes('EVET')) {
      alert('Kralsın! Hediye sözünü aldım 🚀');
    }
  }

  document.getElementById('contact-form').addEventListener('submit', function(event) {
    event.preventDefault();
    
    document.getElementById('love_score').value = document.getElementById('lovePercent').innerText;
    document.getElementById('gift_status').value = giftChoice;

    emailjs.sendForm('service_uxg18as', 'template_k5kyz1w', this)
      .then(function() {
        alert('Notun ve seçimlerin bana ulaştı! Teşekkürler! 🎉');
        document.getElementById('contact-form').reset();
      }, function(error) {
        alert('Bir hata oluştu: ' + JSON.stringify(error));
      });
  });

  function updateCountdown() {
    const now = new Date();
    let currentYear = now.getFullYear();
    let birthday = new Date(currentYear, 8, 9, 0, 0, 0);

    if (now.getTime() > birthday.getTime()) {
      birthday = new Date(currentYear + 1, 8, 9, 0, 0, 0);
    }

    const diff = birthday - now;

    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const m = Math.floor((diff / 1000 / 60) % 60);
    const s = Math.floor((diff / 1000) % 60);

    document.getElementById('days').innerText = d < 10 ? '0' + d : d;
    document.getElementById('hours').innerText = h < 10 ? '0' + h : h;
    document.getElementById('minutes').innerText = m < 10 ? '0' + m : m;
    document.getElementById('seconds').innerText = s < 10 ? '0' + s : s;
  }
  setInterval(updateCountdown, 1000);
  updateCountdown();

  const bgMusic = document.getElementById('bgMusic');
  window.addEventListener('click', () => {
    if (bgMusic && bgMusic.paused) {
      bgMusic.play().catch(() => {});
    }
  }, { once: true });

  const slider = document.getElementById('loveSlider');
  const percentText = document.getElementById('lovePercent');
  const loveText = document.getElementById('loveText');
  const lily = document.getElementById('lily');

  slider.addEventListener('input', (e) => {
    const val = parseInt(e.target.value);
    percentText.innerText = `%${val}`;

    lily.classList.remove('dancing');

    if (val <= 35) {
      lily.src = "./9939.png";
      loveText.innerText = "Karanlıkta Kalan Sevgi... 🥺";
    } else if (val <= 49) {
      lily.src = "./8431.png";
      loveText.innerText = "Havalı Ama Biraz Az... 😎";
    } else if (val <= 65) {
      lily.src = "./9432.png";
      loveText.innerText = "Açık Kollarla Sevgi! 🤗";
    } else if (val <= 90) {
      lily.src = "./9527.png";
      loveText.innerText = "Parti Modu Açıldı! 🎉";
    } else {
      lily.src = "./9527.png";
      lily.classList.add('dancing');
      loveText.innerText = "İŞTE BUMMM! %100 GERÇEK SEVGİ! 💃🎉";
    }
  });

  const noBtn = document.getElementById('noBtn');
  noBtn.addEventListener('mouseover', moveButton);
  noBtn.addEventListener('touchstart', moveButton);

  function moveButton() {
    const x = Math.random() * 200 - 100;
    const y = Math.random() * 100 - 50;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
  }
</script>

</body>
</html>
